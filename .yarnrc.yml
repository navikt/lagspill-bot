compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmScopes:
  navikt:
    npmAlwaysAuth: true
    npmAuthToken: '${NODE_AUTH_TOKEN:-}'
    npmRegistryServer: "https://npm.pkg.github.com"

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-engines.cjs
    spec: "https://raw.githubusercontent.com/devoto13/yarn-plugin-engines/main/bundles/%40yarnpkg/plugin-engines.js"

# Sikkerhetstiltak
enableScripts: false # Forhindre kjøring av scripts ved installasjon av pakker
enableImmutableInstalls: true # Sikre at installasjoner er konsistente med lockfilen
defaultSemverRangePrefix: '' # Bruk eksakte versjoner av pakker som standard (ikke "^x.x.x")
